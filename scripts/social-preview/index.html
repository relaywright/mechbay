<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MechBay social preview</title>
  <style>
    /* Fonts come from the same packages the app and landing page ship. */
    @font-face { font-family: 'Barlow Condensed'; src: url('../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
    @font-face { font-family: 'Barlow'; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
    :root {
      --bg: #111610; --panel: #191f17; --border: #394232;
      --orange: #e5b56a; --amber: #efc36d; --green: #b2ce8c; --cyan: #91c7bc;
      --text: #e7e1d7; --muted: #a59c8f; --dim: #8a8175;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1280px; height: 640px; overflow: hidden; }
    body {
      position: relative; color: var(--text); font-family: 'IBM Plex Mono', monospace;
      background:
        radial-gradient(circle at 18% 30%, rgba(232, 95, 0, .09), transparent 34rem),
        linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px) 0 0 / 40px 40px,
        var(--bg);
    }
    body::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .16; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.025) 3px 4px); }
    .copy { position: absolute; left: 64px; top: 68px; width: 500px; }
    .eyebrow { color: var(--orange); font-size: 15px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin-top: 44px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 118px; line-height: .82; letter-spacing: .04em; color: var(--text); text-shadow: 0 0 14px rgba(255,204,51,.14); }
    h1 span { color: var(--amber); }
    .tagline { margin-top: 26px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 29px; line-height: 1.24; letter-spacing: -.01em; color: var(--text); }
    .tagline em { font-style: normal; color: var(--amber); }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; width: 460px; }
    .chip { padding: 8px 14px; border: 1px solid var(--border); background: var(--panel); color: var(--green); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
    .chip::before { content: "■ "; font-size: 11px; vertical-align: 1px; }
    .url { position: absolute; left: 64px; bottom: 44px; color: var(--cyan); font-size: 15px; letter-spacing: .2em; text-transform: uppercase; }
    .url b { color: var(--dim); font-weight: 500; }
    .stage { position: absolute; left: 583px; top: 55px; width: 648px; height: 430px; border: 1px solid #4a5541; background: #0b0f0a; overflow: hidden; box-shadow: 0 0 0 1px #0008, 0 30px 80px #0009; }
    /* The 1600×1000 bay capture at 0.72×, clipped to the isometric field (the
       diamond spans x 170..1040, y 230..660 in the capture, with a margin for
       the buildings and labels) so none of the surrounding HUD text shows. */
    .stage { background: radial-gradient(ellipse at 50% 45%, #182017, #0b0f0a 70%); }
    .stage img { position: absolute; width: 1152px; left: -112px; top: -118px;
      clip-path: polygon(436px 140px, 790px 323px, 436px 506px, 82px 323px); }
    .stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 75%, rgba(11, 15, 10, .5)); }
    .bracket { position: absolute; width: 28px; height: 28px; border-color: var(--amber); border-style: solid; }
    .bracket.tl { left: 575px; top: 47px; border-width: 2px 0 0 2px; }
    .bracket.br { left: 1210px; top: 460px; border-width: 0 2px 2px 0; }
    .tag { position: absolute; right: 60px; top: 30px; color: var(--green); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
    .tag b { color: var(--dim); font-weight: 500; }
    .mechs { position: absolute; left: 560px; bottom: 6px; width: 690px; height: 190px; display: flex; align-items: flex-end; justify-content: space-between; }
    .mechs img { display: block; filter: drop-shadow(0 10px 14px rgba(0,0,0,.6)); }
  </style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">Open source / Agent operations</p>
    <h1>MECH<span>BAY</span></h1>
    <p class="tagline">Deploy AI coding agents as <em>mechs</em> into your real projects. Watch them work. Read the diff when they return.</p>
    <div class="chips">
      <span class="chip">Claude Code</span><span class="chip">Codex</span><span class="chip">Gemini CLI</span><span class="chip">Any CLI agent</span>
    </div>
  </div>
  <p class="url">github.com/relaywright/mechbay <b>· MIT</b></p>
  <p class="tag"><span style="color: var(--green)">●</span> Real app <b>·</b> Demo mode</p>
  <span class="bracket tl"></span>
  <div class="stage"><img src="../../site/screenshot-bay.png" alt=""></div>
  <span class="bracket br"></span>
  <div class="mechs">
    <img src="../../site/mech-locust.png" width="150" height="150" alt="">
    <img src="../../site/mech-raven.png" width="160" height="160" alt="">
    <img src="../../site/mech-atlas.png" width="210" height="210" alt="">
    <img src="../../site/mech-marauder.png" width="170" height="170" alt="">
    <img src="../../site/mech-catapult.png" width="180" height="180" alt="">
  </div>
</body>
</html>
