appId: com.relaywright.mechbay
productName: MechBay
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!docs/*'
  - '!.tmp/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md,CONTRIBUTING.md,TODO.md,VISION.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!scripts/*.{ts,mjs}'
  - '!site/*'
  - '!artifacts/*'
  # Source art: the renderer imports these via `?url`, so electron-vite
  # already copies every sprite it uses into out/renderer/assets.
  - '!assets/**'
  - '!.github/*'
  - '!.agents/*'
  - '!.superpowers/*'
  - '!.worktrees/*'
  - '!.claude/*'
  - '!*.tsbuildinfo'
  - '!wrangler.jsonc'
asarUnpack:
  - resources/**
  - out/renderer/assets/*.png
  - scripts/kimi_fireworks.py
publish:
  provider: github
  owner: relaywright
  repo: mechbay
  releaseType: draft
win:
  executableName: MechBay
  # DECISION NEEDED (before first shipped build): code-signing.
  # Unsigned Windows binaries will trip SmartScreen's "unrecognized app"
  # warning on first launch. Options:
  #   - Ship unsigned for dev/beta (current default, warning is
  #     dismissable with "More info → Run anyway")
  #   - Buy an EV or standard Authenticode cert ($200-$500/yr) and add
  #     `certificateFile` + `certificatePassword` env-var references here
  # Revisit once MechBay goes beyond personal use.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  extendInfo:
    - NSDocumentsFolderUsageDescription: MechBay opens project directories you select to stream CLI output and show file trees.
  notarize: false
dmg:
  # ${arch} is required: mac builds both arm64 and x64, and without it the
  # two DMGs share one filename and overwrite each other in the release.
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  maintainer: relaywright <220244294+relaywright@users.noreply.github.com>
  category: Development
  desktop:
    entry:
      Name: MechBay
      Comment: A BattleTech-inspired command bay for AI coding agents
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
# Publishing goes to GitHub Releases as a draft (see `publish:` above).
# Draft is deliberate: the maintainer reviews the generated release and
# clicks Publish manually rather than it going live automatically.
